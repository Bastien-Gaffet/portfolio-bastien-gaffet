<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography / Bastien Gaffet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:        #05060A;
  --violet:       hsl(265 75% 60%);
  --violet-glow:  hsl(265 75% 60% / 0.2);
  --white:        oklch(96% 0.005 250);
  --dim:          oklch(60% 0.01 250);
  --glass-bg:     rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.09);
}

html { scroll-behavior: smooth; }
body {
  background: var(--black); color: var(--white);
  font-family: 'Inter', sans-serif; font-weight: 300;
  overflow-x: hidden; opacity: 0;
  animation: fadeIn 0.7s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

#cosmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

nav {
  position: fixed; top: 0; right: 0; z-index: 100;
  padding: 2rem 2.5rem; display: flex; gap: 2rem; align-items: center;
}
nav a {
  color: var(--dim); text-decoration: none;
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.3s;
}
nav a:hover { color: var(--white); }
nav .nav-active { color: var(--white); }

/* ══ HERO ══ */
#hero {
  min-height: 55vh; display: flex; flex-direction: column;
  justify-content: flex-end; position: relative; z-index: 1;
}
#hero .inner { padding-bottom: 3.5rem; max-width: 700px; margin: 0; padding-left: 3rem; }
.hero-eyebrow {
  font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--violet); margin-bottom: 1.2rem;
}
.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 8vw, 6.5rem);
  font-weight: 400; line-height: 1.0; letter-spacing: -0.02em; margin-bottom: 1.8rem;
}
.hero-title em { font-style: italic; color: hsl(265 60% 80%); }
.hero-desc { font-size: 0.85rem; color: var(--dim); line-height: 1.85; max-width: 460px; }

/* ══ GRID ══ */
#grid-section {
  position: relative; z-index: 1;
  padding: 4rem 2rem 8rem;
  border-top: 1px solid var(--glass-border);
}

.masonry {
  columns: 3 320px;
  column-gap: 1rem;
}
@media(max-width: 700px) { .masonry { columns: 1; } }
@media(min-width: 700px) and (max-width: 1100px) { .masonry { columns: 2; } }

/* ══ PHOTO ITEM ══ */
.photo-item {
  break-inside: avoid;
  margin-bottom: 1rem;
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.8s cubic-bezier(.22,.61,.36,1),
              transform 0.8s cubic-bezier(.22,.61,.36,1);
}
.photo-item.visible { opacity: 1; transform: translateY(0); }

.photo-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.6s cubic-bezier(.22,.61,.36,1), filter 0.4s ease;
}
.photo-item:hover img {
  transform: scale(1.03);
  filter: brightness(1.05);
}

/* Hover caption overlay */
.item-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(5,6,10,0.82) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.35s ease;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 1.2rem 1rem 1rem;
}
.photo-item:hover .item-overlay { opacity: 1; }

.item-title {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem; font-weight: 400; line-height: 1.2;
  margin-bottom: 0.2rem;
}
.item-title em { font-style: italic; color: hsl(265 60% 80%); }
.item-meta {
  font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--dim);
}

/* ══ LIGHTBOX ══ */
#lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(5,6,10,0.95); backdrop-filter: blur(16px);
  display: none; align-items: center; justify-content: center;
  padding: 2rem;
}
#lightbox.open { display: flex; }

#lightbox-inner {
  position: relative;
  max-width: 90vw; max-height: 88vh;
  display: flex; flex-direction: column; align-items: center;
  animation: lbIn 0.35s cubic-bezier(.22,.61,.36,1);
}
@keyframes lbIn {
  from { opacity: 0; transform: scale(.96); }
  to   { opacity: 1; transform: scale(1); }
}

#lightbox-img {
  max-width: 100%; max-height: 78vh;
  object-fit: contain; border-radius: 4px;
  display: block;
}

#lightbox-caption {
  margin-top: 1.2rem; text-align: center;
}
#lb-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 400;
  margin-bottom: 0.25rem;
}
#lb-title em { font-style: italic; color: hsl(265 60% 80%); }
#lb-meta {
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--dim);
}

/* Lightbox controls */
.lb-btn {
  position: fixed; top: 50%; transform: translateY(-50%);
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 50%; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: var(--dim); cursor: pointer; font-size: 1.1rem;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.lb-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); }
#lb-prev { left: 1.5rem; }
#lb-next { right: 1.5rem; }

#lb-close {
  position: fixed; top: 1.5rem; right: 1.5rem;
  background: transparent; border: 1px solid var(--glass-border);
  border-radius: 30px; padding: 0.4rem 1rem;
  color: var(--dim); cursor: pointer; font-family: 'Inter', sans-serif;
  font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
  transition: color 0.2s, border-color 0.2s;
}
#lb-close:hover { color: var(--white); border-color: rgba(255,255,255,0.18); }

#lb-counter {
  position: fixed; top: 1.8rem; left: 50%; transform: translateX(-50%);
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: 0.78rem; color: var(--dim);
}

/* Placeholder when no image */
.photo-placeholder {
  width: 100%; background: hsl(265 20% 10%);
  border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
}
.placeholder-num {
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: 1.4rem; color: var(--dim); opacity: 0.3;
}

/* ══ FOOTER ══ */
#page-footer {
  border-top: 1px solid var(--glass-border);
  position: relative; z-index: 1; padding: 4rem 0;
}
#page-footer .inner {
  max-width: 980px; margin: 0 auto; padding: 0 3rem;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2rem;
}
.btn-pill {
  display: inline-flex; align-items: center; gap: 0.5rem;
  text-decoration: none; color: var(--dim); font-size: 0.68rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid var(--glass-border); border-radius: 30px;
  padding: 0.5rem 1.3rem; transition: color 0.3s, border-color 0.3s;
}
.btn-pill:hover { color: var(--white); border-color: rgba(255,255,255,0.18); }
.footer-sig { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.85rem; color: var(--dim); }

.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.9s cubic-bezier(.22,.61,.36,1), transform 0.9s cubic-bezier(.22,.61,.36,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
.d1 { transition-delay: .15s; } .d2 { transition-delay: .3s; }
</style>
</head>
<body>

<canvas id="cosmos"></canvas>

<nav>
  <a href="story-v6.html">Story</a>
  <a href="about.html">About</a>
  <a href="universe.html">Universe</a>
  <a href="work-v4.html">Work</a>
</nav>

<section id="hero">
  <div class="inner">
    <p class="hero-eyebrow reveal">Photography</p>
    <h1 class="hero-title">
      <span class="reveal">Through</span><br>
      <em class="reveal d1">the lens</em>
    </h1>
    <p class="hero-desc reveal d2">
      Moments captured with what I have. Light, geometry, and the small details most people walk past.
    </p>
  </div>
</section>

<section id="grid-section">
  <div class="masonry" id="masonry"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lb-close">Close</button>
  <p id="lb-counter"></p>
  <button class="lb-btn" id="lb-prev">&#8592;</button>
  <button class="lb-btn" id="lb-next">&#8594;</button>
  <div id="lightbox-inner">
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption">
      <p id="lb-title"></p>
      <p id="lb-meta"></p>
    </div>
  </div>
</div>

<footer id="page-footer">
  <div class="inner">
    <a href="about.html" class="btn-pill">← About</a>
    <span class="footer-sig">Bastien Gaffet</span>
    <a href="work-v4.html" class="btn-pill">Work →</a>
  </div>
</footer>

<script>
// ══ PHOTOS DATA ═══════════════════════════════════════════════════════════════
// Add your photos here.
// src    : path to image file, e.g. 'photos/sunset.jpg'
// title  : displayed in overlay and lightbox
// location + date : displayed as subtitle
// aspect : 'landscape' (default), 'portrait', or 'square'
//          Used to set placeholder height when no image is loaded yet.
const PHOTOS = [
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'landscape' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'portrait' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2024', aspect: 'square' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2024', aspect: 'landscape' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2024', aspect: 'portrait' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2024', aspect: 'landscape' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'square' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'portrait' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'landscape' },
  { src: '', title: 'Photo title',    location: 'Location', date: '2025', aspect: 'landscape' },
];

// Aspect ratio for placeholders
const ASPECT_RATIOS = { landscape: '75%', portrait: '133%', square: '100%' };

// ══ BUILD GRID ════════════════════════════════════════════════════════════════
const masonry = document.getElementById('masonry');

PHOTOS.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'photo-item';
  item.dataset.index = i;

  if (p.src) {
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = p.title;
    img.loading = 'lazy';
    item.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'photo-placeholder';
    ph.style.paddingBottom = ASPECT_RATIOS[p.aspect || 'landscape'];
    const num = document.createElement('span');
    num.className = 'placeholder-num';
    num.textContent = String(i + 1).padStart(2, '0');
    ph.appendChild(num);
    item.appendChild(ph);
  }

  const overlay = document.createElement('div');
  overlay.className = 'item-overlay';

  const words = p.title.split(' ');
  const titleHTML = words.length > 1
    ? `${words[0]} <em>${words.slice(1).join(' ')}</em>`
    : `<em>${p.title}</em>`;

  overlay.innerHTML = `
    <p class="item-title">${titleHTML}</p>
    <p class="item-meta">${p.location} &nbsp;·&nbsp; ${p.date}</p>
  `;
  item.appendChild(overlay);

  item.addEventListener('click', () => openLightbox(i));
  masonry.appendChild(item);
});

// ══ REVEAL ON SCROLL ══════════════════════════════════════════════════════════
const itemObs = new IntersectionObserver(entries => {
  entries.forEach((e, idx) => {
    if (e.isIntersecting) {
      setTimeout(() => e.target.classList.add('visible'), idx * 60);
      itemObs.unobserve(e.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.photo-item').forEach(el => itemObs.observe(el));

const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revObs.unobserve(e.target); }});
}, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
document.querySelectorAll('.reveal').forEach(el => revObs.observe(el));
window.addEventListener('load', () => {
  document.querySelectorAll('#hero .reveal').forEach((el, i) => {
    setTimeout(() => el.classList.add('visible'), 150 + i * 180);
  });
});

// ══ LIGHTBOX ══════════════════════════════════════════════════════════════════
const lb       = document.getElementById('lightbox');
const lbImg    = document.getElementById('lightbox-img');
const lbTitle  = document.getElementById('lb-title');
const lbMeta   = document.getElementById('lb-meta');
const lbCount  = document.getElementById('lb-counter');
let lbCurrent  = 0;

function openLightbox(idx) {
  lbCurrent = idx;
  renderLightbox();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function renderLightbox() {
  const p = PHOTOS[lbCurrent];
  const n = PHOTOS.length;

  if (p.src) {
    lbImg.src = p.src;
    lbImg.style.display = 'block';
  } else {
    lbImg.style.display = 'none';
  }

  const words = p.title.split(' ');
  lbTitle.innerHTML = words.length > 1
    ? `${words[0]} <em>${words.slice(1).join(' ')}</em>`
    : `<em>${p.title}</em>`;
  lbMeta.textContent = `${p.location} · ${p.date}`;
  lbCount.textContent = `${String(lbCurrent + 1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;
}

function lbNav(dir) {
  const n = PHOTOS.length;
  lbCurrent = ((lbCurrent + dir) % n + n) % n;
  renderLightbox();
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => lbNav(-1));
document.getElementById('lb-next').addEventListener('click', () => lbNav(1));

lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

window.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft')  lbNav(-1);
  if (e.key === 'Escape')     closeLightbox();
});

// Touch swipe on lightbox
let lbTouchX = 0;
lb.addEventListener('touchstart', e => { lbTouchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend',   e => {
  const delta = e.changedTouches[0].clientX - lbTouchX;
  if (delta < -40) lbNav(1);
  else if (delta > 40) lbNav(-1);
}, { passive: true });

// ══ COSMOS ════════════════════════════════════════════════════════════════════
const cv = document.getElementById('cosmos');
const ctx = cv.getContext('2d');
let W, H, stars = [];

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
function initS() {
  stars = Array.from({length: 160}, () => {
    const a = Math.random() * Math.PI * 2, r = Math.random() * Math.max(W, H) * .65;
    return { x: W/2+Math.cos(a)*r, y: H/2+Math.sin(a)*r, rad: Math.random()*1.1+.15,
             al: Math.random()*.45+.05, sp: (Math.random()*.3+.05)*.00007,
             a, radius: r, tw: Math.random()*Math.PI*2 };
  });
}
function drawBg(t) {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);
  bg.addColorStop(0,'rgba(14,10,30,1)'); bg.addColorStop(.3,'rgba(8,6,18,1)'); bg.addColorStop(1,'rgba(5,6,10,1)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  stars.forEach(s => {
    s.a += s.sp; s.x = W/2+Math.cos(s.a)*s.radius; s.y = H/2+Math.sin(s.a)*s.radius;
    const a = s.al*(0.6+0.4*Math.sin(s.tw+t*.001));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.rad, 0, Math.PI*2);
    ctx.fillStyle = `rgba(210,200,255,${a})`; ctx.fill();
  });
  requestAnimationFrame(drawBg);
}
resize(); initS(); requestAnimationFrame(drawBg);
window.addEventListener('resize', () => { resize(); initS(); });
</script>
</body>
</html>
