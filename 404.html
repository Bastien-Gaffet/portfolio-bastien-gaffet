<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 / Bastien Gaffet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:        #05060A;
  --violet:       hsl(265 75% 60%);
  --violet-glow:  hsl(265 75% 60% / 0.2);
  --white:        oklch(96% 0.005 250);
  --dim:          oklch(60% 0.01 250);
  --glass-border: rgba(255,255,255,0.09);
}

html, body { height: 100%; }
body {
  background: var(--black); color: var(--white);
  font-family: 'Inter', sans-serif; font-weight: 300;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; animation: fadeIn 0.8s ease 0.2s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

#cosmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

nav {
  position: fixed; top: 0; right: 0; z-index: 100;
  padding: 2rem 2.5rem; display: flex; gap: 2rem; align-items: center;
}
nav a {
  color: var(--dim); text-decoration: none;
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.3s;
}
nav a:hover { color: var(--white); }

.container {
  position: relative; z-index: 1;
  text-align: center; padding: 2rem;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

.error-num {
  font-family: 'Playfair Display', serif;
  font-size: clamp(7rem, 20vw, 14rem);
  font-weight: 400; line-height: 1;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, var(--white) 20%, hsl(265 75% 70%));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  opacity: 0; animation: slideUp 0.9s cubic-bezier(.22,.61,.36,1) 0.4s forwards;
}

.error-label {
  font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--violet); margin-bottom: 2rem;
  opacity: 0; animation: slideUp 0.9s cubic-bezier(.22,.61,.36,1) 0.6s forwards;
}

.error-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.2rem, 3vw, 2rem);
  font-weight: 400; line-height: 1.2;
  margin-bottom: 1rem;
  opacity: 0; animation: slideUp 0.9s cubic-bezier(.22,.61,.36,1) 0.75s forwards;
}
.error-title em { font-style: italic; color: hsl(265 60% 80%); }

.error-desc {
  font-size: 0.85rem; color: var(--dim); line-height: 1.8;
  max-width: 420px; margin-bottom: 3rem;
  opacity: 0; animation: slideUp 0.9s cubic-bezier(.22,.61,.36,1) 0.9s forwards;
}

.error-links {
  display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
  opacity: 0; animation: slideUp 0.9s cubic-bezier(.22,.61,.36,1) 1.05s forwards;
}

.btn-pill {
  display: inline-flex; align-items: center; gap: 0.5rem;
  text-decoration: none; color: var(--dim); font-size: 0.68rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid var(--glass-border); border-radius: 30px;
  padding: 0.65rem 1.6rem; transition: color 0.3s, border-color 0.3s, box-shadow 0.3s;
}
.btn-pill:hover { color: var(--white); border-color: rgba(255,255,255,0.18); }
.btn-pill.primary {
  border-color: var(--violet); color: var(--white);
  background: var(--violet-glow);
}
.btn-pill.primary:hover { box-shadow: 0 0 24px hsl(265 75% 60% / 0.2); }

/* Floating particles */
.particle {
  position: fixed; border-radius: 50%;
  background: var(--violet); opacity: 0;
  animation: float linear infinite;
  pointer-events: none; z-index: 0;
}
@keyframes float {
  0%   { transform: translateY(110vh) scale(0); opacity: 0; }
  10%  { opacity: 0.4; }
  90%  { opacity: 0.2; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="cosmos"></canvas>

<nav>
  <a href="story-v6.html">Story</a>
  <a href="about.html">About</a>
  <a href="universe.html">Universe</a>
  <a href="work-v4.html">Work</a>
</nav>

<div class="container">
  <p class="error-label">Error</p>
  <div class="error-num">404</div>
  <h1 class="error-title">This page <em>got lost in space.</em></h1>
  <p class="error-desc">
    The page you are looking for does not exist, was moved,
    or is still being built somewhere in the universe.
  </p>
  <div class="error-links">
    <a href="story-v6.html" class="btn-pill primary">← Back to Story</a>
    <a href="work-v4.html" class="btn-pill">View Work</a>
    <a href="about.html" class="btn-pill">About</a>
  </div>
</div>

<script>
/* ── COSMOS ── */
const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');
let W, H, stars = [];
const NUM_STARS = 220;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', () => { resize(); initStars(); }); resize();

function initStars() {
  stars = [];
  for (let i = 0; i < NUM_STARS; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * Math.max(W, H) * 0.65;
    stars.push({
      x: W/2 + Math.cos(angle)*radius, y: H/2 + Math.sin(angle)*radius,
      r: Math.random()*1.1+0.15, alpha: Math.random()*0.5+0.08,
      twinkle: Math.random()*Math.PI*2,
      speed: (Math.random()*0.3+0.05)*0.00008,
      angle, radius
    });
  }
}
initStars();

function draw(t) {
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.8);
  bg.addColorStop(0,'rgba(14,10,30,1)');
  bg.addColorStop(0.3,'rgba(8,6,18,1)');
  bg.addColorStop(1,'rgba(5,6,10,1)');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const g1 = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.5);
  g1.addColorStop(0,'rgba(100,50,200,0)');
  g1.addColorStop(0.3,'rgba(100,50,200,0.06)');
  g1.addColorStop(0.7,'rgba(60,20,140,0.09)');
  g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);

  stars.forEach(s => {
    s.angle += s.speed;
    s.x = W/2 + Math.cos(s.angle)*s.radius;
    s.y = H/2 + Math.sin(s.angle)*s.radius;
    const a = Math.max(0, Math.min(1, s.alpha + Math.sin(s.twinkle + t*0.001)*0.25));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${a})`; ctx.fill();
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── FLOATING PARTICLES ── */
function spawnParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 3 + 1;
  p.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}vw;
    animation-duration:${Math.random()*12+8}s;
    animation-delay:${Math.random()*6}s;
  `;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 20000);
}
for (let i = 0; i < 12; i++) spawnParticle();
setInterval(spawnParticle, 2000);
</script>
</body>
</html>
