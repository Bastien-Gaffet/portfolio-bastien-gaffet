<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bastien Gaffet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #05060A;
      color: oklch(96% 0.005 250);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .center {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: hsl(265 75% 60% / 0.5);
      opacity: 0;
      animation: fadeUp 1s ease 0.55s forwards;
    }

    .tagline {
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: oklch(60% 0.01 250);
      opacity: 0;
      animation: fadeUp 1s ease 0.8s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="cosmos"></canvas>

  <div class="center">
    <h1 class="name">Bastien Gaffet</h1>
    <div class="divider"></div>
    <p class="tagline">Coming soon &nbsp;·&nbsp; Bientôt disponible</p>
  </div>

  <script>
    const canvas = document.getElementById('cosmos');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];
    const NUM = 220;

    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }

    function initStars() {
      stars = [];
      for (let i = 0; i < NUM; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * Math.max(W, H) * .65;
        stars.push({
          x: W/2 + Math.cos(a)*r, y: H/2 + Math.sin(a)*r,
          rad: Math.random()*1.1+.15, alpha: Math.random()*.5+.08,
          twinkle: Math.random()*Math.PI*2,
          speed: (Math.random()*.3+.05)*.00008, angle: a, radius: r
        });
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H)*.8);
      bg.addColorStop(0, 'rgba(14,10,30,1)');
      bg.addColorStop(.3, 'rgba(8,6,18,1)');
      bg.addColorStop(1, 'rgba(5,6,10,1)');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      const g1 = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W, H)*.5);
      g1.addColorStop(0, 'rgba(100,50,200,0)');
      g1.addColorStop(.3, 'rgba(100,50,200,.06)');
      g1.addColorStop(.7, 'rgba(60,20,140,.09)');
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);
      stars.forEach(s => {
        s.angle += s.speed;
        s.x = W/2 + Math.cos(s.angle) * s.radius;
        s.y = H/2 + Math.sin(s.angle) * s.radius;
        const a = Math.max(0, Math.min(1, s.alpha + Math.sin(s.twinkle + t*.001)*.25));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.rad, 0, Math.PI*2);
        ctx.fillStyle = `rgba(220,210,255,${a})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    resize(); initStars(); requestAnimationFrame(draw);
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>
</body>
</html>
