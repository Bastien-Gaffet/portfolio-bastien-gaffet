# /etc/nginx/sites-available/moi-bastiengaffet-redirect.conf
# moi.bastiengaffet.fr was the old Netlify address of the portfolio. It now points to the VPS
# (DNS A record) and only redirects, permanently, to the same path on bastiengaffet.fr.
server {
    listen 80;
    server_name moi.bastiengaffet.fr;
    location /.well-known/acme-challenge/ { root /var/www/equiliz-acme; }
    location / { return 301 https://bastiengaffet.fr$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name moi.bastiengaffet.fr;
    ssl_certificate /etc/letsencrypt/live/moi.bastiengaffet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moi.bastiengaffet.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://bastiengaffet.fr$request_uri;
}
