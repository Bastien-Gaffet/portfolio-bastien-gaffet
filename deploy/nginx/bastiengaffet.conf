# /etc/nginx/sites-available/bastiengaffet.conf  (symlinked from sites-enabled)
# Portfolio of Bastien Gaffet, served from /var/www/portfolio/current.
# TLS terminates here on 127.0.0.1:8443, behind the port 443 multiplexer (stream block in nginx.conf).
# Preserved on purpose: the drive and auto-visio includes, the legacy Webtouraine redirects.

server {
    listen 127.0.0.1:8443 ssl;
    server_name bastiengaffet.fr www.bastiengaffet.fr;

    root /var/www/portfolio/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bastiengaffet.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bastiengaffet.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/drive.conf;
    include /etc/nginx/snippets/auto-visio.conf;

    if ($host = www.bastiengaffet.fr) {
        return 301 https://bastiengaffet.fr$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    client_max_body_size 16k;   # the portfolio accepts no uploads
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 15s;

    # ---- not found page (keeps the 404 status) ----
    error_page 404 @notfound;
    location @notfound {
        internal;
        rewrite ^ /404.html break;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
    }

    # ---- home ----
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
    }
    location = /index.html { return 301 https://bastiengaffet.fr/; }
    location = /story.html { return 301 https://bastiengaffet.fr/; }
    location = /story      { return 301 https://bastiengaffet.fr/; }

    # ---- legacy Webtouraine addresses that used to live on the root ----
    location = /merci.html { return 301 https://webtouraine.bastiengaffet.fr/merci.html; }
    location = /mentions-legales.html { return 301 https://webtouraine.bastiengaffet.fr/mentions-legales.html; }
    location ~ ^/mockup-site-.*\.html$ { return 301 https://webtouraine.bastiengaffet.fr$request_uri; }

    # ---- old portfolio addresses (flat project-x.html) -> clean URLs ----
    location = /project-hopetime.html { return 301 https://bastiengaffet.fr/project/kairoo; }
    location = /project-hopetime      { return 301 https://bastiengaffet.fr/project/kairoo; }
    location = /product-cosmos-wallpaper.html { return 301 https://bastiengaffet.fr/product/cosmos-wallpaper; }
    location ~ ^/project-([a-z0-9-]+)(?:\.html)?$ { return 301 https://bastiengaffet.fr/project/$1; }
    location ~ ^/(project|product)/([a-z0-9-]+)\.html$ { return 301 https://bastiengaffet.fr/$1/$2; }

    # ---- generated data ----
    location = /activity.json {
        alias /var/www/portfolio/shared/activity.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
    }

    # ---- security.txt and other well-known files only ----
    location ^~ /.well-known/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }

    # ---- never served, whatever ends up in the web root ----
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(md|py|sh|toml|ya?ml|zip|gz|tar|env|log|bak|sql|gvdesign|webm|json|map|lock)$ { return 404; }
    location ~ ^/(old|deploy|node_modules)/ { return 404; }

    # ---- clean URLs: /about.html -> /about ----
    location ~ ^/(.+)\.html$ { return 301 https://bastiengaffet.fr/$1; }

    # ---- static assets ----
    location ~* \.(png|jpe?g|webp|svg|ico|pdf|woff2?)$ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;   # unversioned files: always revalidate
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }

    # ---- pages (GET and HEAD only) ----
    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        try_files $uri $uri.html =404;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name bastiengaffet.fr www.bastiengaffet.fr;
    location /.well-known/acme-challenge/ { root /var/www/equiliz-acme; }
    location / { return 301 https://bastiengaffet.fr$request_uri; }
}
